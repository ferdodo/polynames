services:

  core-deps:
    build:
      context: core
      target: deps

  core:
    build:
      context: core
      additional_contexts:
        polynames-design-system: service:design-system
        polynames-core-deps: service:core-deps

  design-system:
    build: design-system
    ports:
      - 7824:5173

  coverage:
    build:
      context: coverage
      additional_contexts:
        polynames-core: service:core
    ports:
      - 7823:80

  back-deps:
    build:
      context: back
      target: deps

  back:
    build:
      context: back
      additional_contexts:
        polynames-core: service:core
        polynames-back-deps: service:back-deps
    ports:
      - ${VITE_BACK_PORT:?}:3000
    environment:
      ROLE_SIGN_PASSPHRASE: ${ROLE_SIGN_PASSPHRASE:?}
      ROLE_SIGN_SALT: ${ROLE_SIGN_SALT:?}
      WEBSOCKET_PROTOCOL: ${VITE_WEBSOCKET_PROTOCOL:?}
      WEB_ORIGIN: ${WEB_ORIGIN:?}
    restart: always

  front-deps:
    build:
      context: front
      target: deps

  front:
    build:
      context: front
      args:
        VITE_BACK_DOMAIN: ${VITE_BACK_DOMAIN}
        VITE_WEBSOCKET_PROTOCOL: ${VITE_WEBSOCKET_PROTOCOL}
        VITE_BACK_PORT: ${VITE_BACK_PORT:?}
        VITE_PROD_BACK_DOMAIN: ${VITE_PROD_BACK_DOMAIN:?}
        VITE_PROD_WEBSOCKET_PROTOCOL: ${VITE_PROD_WEBSOCKET_PROTOCOL:?}
        VITE_PROD_BACK_PORT: ${VITE_PROD_BACK_PORT:?}
      additional_contexts:
        polynames-core: service:core
        polynames-front-deps: service:front-deps
    environment:
      VITE_BACK_DOMAIN: ${VITE_BACK_DOMAIN}
      VITE_WEBSOCKET_PROTOCOL: ${VITE_WEBSOCKET_PROTOCOL}
      VITE_BACK_PORT: ${VITE_BACK_PORT:?}
    depends_on:
      - back
    ports:
      - 7825:7825
